name: Image Import Only
on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 3"
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install beautifulsoup4 lxml requests cos-python-sdk-v5

      - name: Run image import
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
        run: |
          python bzuu_image_import.py 2>&1

      - name: Commit progress back
        run: |
          git config user.name "gitfox-enter"
          git config user.email "gitfox-enter@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: image import progress $(date +%Y-%m-%d)"
            git push origin main
          fi
