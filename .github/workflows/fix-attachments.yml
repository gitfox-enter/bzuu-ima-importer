name: Fix Missed Attachments
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-atts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar unzip
          pip install -r requirements.txt

      - name: Run fix missed attachments
        env:
          CRAWL_DATA: ${{ github.workspace }}/crawl_results_v5.json
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
        run: |
          python fix_missed_attachments.py 2>&1

      - name: Commit progress back
        run: |
          git config user.name "gitfox-enter"
          git config user.email "gitfox-enter@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: fix attachments progress $(date +%Y-%m-%d %H:%M)"
            git push origin main
          fi
